<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Contact</title>
<style>
  :root { --bg:#0a0f1e; --card:#121a2e; --text:#e8e8ec; --muted:#8b949e; --blue:#409cff; --line:#23304d; --ok:#3fb950; --err:#f85149; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 16px; }
  .card { width:100%; max-width:440px; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:28px 22px; }
  .top { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
  .brand { font-size:.8rem; color:var(--muted); }
  .lang { background:none; border:1px solid var(--line); color:var(--muted); border-radius:8px; padding:4px 10px; cursor:pointer; font-size:.8rem; }
  h1 { font-size:1.35rem; margin:10px 0 6px; }
  p.sub { color:var(--muted); margin:0 0 20px; font-size:.95rem; line-height:1.4; }
  label { display:block; font-size:.8rem; color:var(--muted); margin:14px 0 6px; }
  input, textarea { width:100%; background:#0d1426; border:1px solid var(--line); color:var(--text); border-radius:10px; padding:12px; font-size:1rem; font-family:inherit; }
  textarea { min-height:80px; resize:vertical; }
  .consent { display:flex; gap:10px; align-items:flex-start; margin-top:16px; font-size:.82rem; color:var(--muted); line-height:1.4; }
  .consent input { width:auto; margin-top:3px; }
  button.send { width:100%; margin-top:18px; background:var(--blue); color:#fff; border:none; border-radius:10px; padding:14px; font-size:1rem; font-weight:600; cursor:pointer; }
  button.send:disabled { opacity:.6; cursor:default; }
  .msg { margin-top:16px; padding:12px; border-radius:10px; font-size:.92rem; display:none; }
  .msg.ok { display:block; background:rgba(63,185,80,.12); color:var(--ok); }
  .msg.err { display:block; background:rgba(248,81,73,.12); color:var(--err); }
  .hp { position:absolute; left:-9999px; }
  .foot { text-align:center; color:var(--muted); font-size:.72rem; margin-top:18px; }
</style>
</head>
<body>
<div class="card">
  <div class="top"><span class="brand" id="brand">—</span><button class="lang" id="langBtn" type="button">EN</button></div>
  <h1 id="title"></h1>
  <p class="sub" id="sub"></p>
  <form id="f" novalidate>
    <label id="lName" for="name"></label><input id="name" autocomplete="name" required>
    <label id="lPhone" for="phone"></label><input id="phone" type="tel" autocomplete="tel" placeholder="+351 9XX XXX XXX" required>
    <label id="lEmail" for="email"></label><input id="email" type="email" autocomplete="email">
    <label id="lMsg" for="message"></label><textarea id="message"></textarea>
    <input class="hp" id="website" tabindex="-1" autocomplete="off">
    <div class="consent"><input type="checkbox" id="consent"><span id="lConsent"></span></div>
    <button class="send" id="send" type="submit"></button>
    <div class="msg" id="msg"></div>
  </form>
  <div class="foot">Powered by NES AI</div>
</div>
<script>
  const API = 'https://api.essential-services.org';
  const token = new URLSearchParams(location.search).get('t') || '';
  const T = {
    pt: { title: 'Fale connosco', sub: 'Deixe os seus dados e a nossa assistente Sara liga-lhe em instantes.', name: 'Nome', phone: 'Telefone (com indicativo, ex. +351)', email: 'Email (opcional)', msg: 'Como podemos ajudar? (opcional)', consent: 'Aceito ser contactado(a) por telefone, incluindo por uma assistente de IA. A chamada pode ser gravada para fins de qualidade.', send: 'Pedir chamada', sending: 'A enviar…', ok: 'Obrigado! A Sara vai ligar-lhe dentro de momentos.', invalid: 'Verifique o nome, o telefone (com +indicativo) e aceite o consentimento.', fail: 'Não foi possível enviar. Tente novamente.', notfound: 'Formulário não encontrado.', priv: 'Os seus dados são usados apenas para responder ao seu pedido e tratados com tecnologia da New Essential Services (NES AI). Pode retirar o consentimento a qualquer momento. <a href="https://nes-ai.com/legal.html" target="_blank" rel="noopener" style="color:#409cff">Política de Privacidade</a>', toggle: 'EN' },
    en: { title: 'Get in touch', sub: 'Leave your details and our assistant Sara will call you within moments.', name: 'Name', phone: 'Phone (with country code, e.g. +351)', email: 'Email (optional)', msg: 'How can we help? (optional)', consent: 'I agree to be contacted by phone, including by an AI assistant. The call may be recorded for quality purposes.', send: 'Request a call', sending: 'Sending…', ok: 'Thank you! Sara will call you within moments.', invalid: 'Please check your name, phone (with +country code) and tick the consent box.', fail: 'Could not send. Please try again.', notfound: 'Form not found.', toggle: 'PT' }
  };
  let lang = 'pt';
  const $ = (id) => document.getElementById(id);
  function render() {
    const t = T[lang];
    document.documentElement.lang = lang;
    $('title').textContent = t.title; $('sub').textContent = t.sub;
    $('lName').textContent = t.name; $('lPhone').textContent = t.phone; $('lEmail').textContent = t.email; $('lMsg').textContent = t.msg;
    $('lConsent').textContent = t.consent; $('send').textContent = t.send; $('langBtn').textContent = t.toggle;
  }
  function show(kind, text) { const m = $('msg'); m.className = 'msg ' + kind; m.textContent = text; }
  $('langBtn').onclick = () => { lang = lang === 'pt' ? 'en' : 'pt'; render(); };
  (async () => {
    try {
      const r = await fetch(API + '/api/public/lead/' + encodeURIComponent(token));
      if (r.ok === false) { render(); show('err', T[lang].notfound); $('send').disabled = true; return; }
      const d = await r.json();
      lang = String(d.locale || 'pt').startsWith('pt') ? 'pt' : 'en';
      $('brand').textContent = d.name || '';
      document.title = d.name || 'Contact';
      render();
    } catch (e) { render(); }
  })();
  $('f').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const t = T[lang];
    const phone = $('phone').value.replace(/[^0-9+]/g, '');
    if ($('name').value.trim().length < 2 || /^\+\d{8,15}$/.test(phone) === false || $('consent').checked === false) { show('err', t.invalid); return; }
    $('send').disabled = true; $('send').textContent = t.sending;
    try {
      const r = await fetch(API + '/api/public/lead/' + encodeURIComponent(token), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: $('name').value.trim(), phone, email: $('email').value.trim(), message: $('message').value.trim(), consent: true, website: $('website').value }) });
      if (r.ok) { show('ok', t.ok); $('f').reset(); } else { show('err', r.status === 400 ? t.invalid : t.fail); }
    } catch (e) { show('err', t.fail); }
    $('send').disabled = false; $('send').textContent = t.send;
  });
  render();
</script>
</body>
</html>
