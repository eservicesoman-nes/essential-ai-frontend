<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>NES AI — Unified Business Platform</title>
  <meta name="description" content="NES AI — Unified Business Platform">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    :root{
      --bg:#0a0e2a;--surface:#0d1117;--border:#1a2332;--text:#e8e8ec;--muted:#8b949e;
      --accent:#409cff;--accent-lo:rgba(64,156,255,.1);--accent-md:rgba(64,156,255,.2);
      --green:#3fb950;--red:#f85149;--amber:#d29922;--purple:#7f77dd;--orange:#f0883e;
      --ui:'Syne',sans-serif;--mono:'DM Mono',monospace;
      --nes-blue:#409cff;--nes-btn-grad:linear-gradient(135deg,#1a56db,#2563eb);
      --card:#0d1117;--card2:#161b22;--border2:#21262d;
    }
    [data-theme="light"]{
      --bg:#f0f2f5;--surface:#ffffff;--border:#d0d7de;--text:#1f2328;--muted:#656d76;
      --accent:#0969da;--accent-lo:rgba(9,105,218,.08);--accent-md:rgba(9,105,218,.15);
      --green:#1a7f37;--red:#cf222e;--amber:#9a6700;--purple:#6639ba;
      --card:#ffffff;--card2:#f6f8fa;--border2:#d0d7de;--nes-blue:#0969da;
      --nes-btn-grad:linear-gradient(135deg,#1a56db,#2563eb);
    }
    /* Sidebar always stays dark regardless of theme */
    .sidebar{background:#0d1117!important;border-right:1px solid #1a2332!important;}
    .sidebar .nav-label{color:#8b949e!important;}
    .sidebar .nav-item{color:#8b949e!important;}
    .sidebar .nav-item:hover{background:rgba(64,156,255,.1)!important;color:#409cff!important;}
    .sidebar .nav-item.active{background:rgba(64,156,255,.1)!important;color:#409cff!important;border-left-color:#409cff!important;}
    .sidebar .sb-brand-name .ai{color:#e8e8ec!important;}
    .sidebar .sb-brand-sub{color:#8b949e!important;}
    .sidebar .sb-divider{background:#1a2332!important;}
    .sidebar .usage-wrap{border-top:1px solid #1a2332!important;background:#0d1117!important;}
    .sidebar .usage-track{background:#1a2332!important;}
    .sidebar .user-av{background:rgba(64,156,255,.1)!important;border-color:rgba(64,156,255,.2)!important;}
    .sidebar .role-chip{background:#0c1f35!important;color:#409cff!important;}
    .sidebar .logout-btn{border-color:#1a2332!important;color:#8b949e!important;}
    .sidebar .client-mgr-btn{background:rgba(64,156,255,.1)!important;border-color:rgba(64,156,255,.2)!important;color:#409cff!important;}
    .sidebar .recent-item:hover{background:rgba(64,156,255,.1)!important;}
    .sidebar .avatar-ring{background:#0a0f1e!important;border-color:#1a56db!important;}
    .sidebar .avatar-online{border-color:#0d1117!important;}
    .sidebar .ci-name{color:#8b949e!important;}
    .sidebar .client-item.active .ci-name{color:#e8e8ec!important;}
    .sidebar .user-email{color:#8b949e!important;}
    .sidebar .sb-brand-name .nes{color:#409cff!important;}
    body{font-family:var(--ui);background:var(--bg);color:var(--text);height:100dvh;display:flex;overflow:hidden;}

    /* ── SIDEBAR ── */
    .sb-toggle{position:fixed;left:16px;top:16px;z-index:1010;background:var(--accent);border:none;border-radius:50%;width:42px;height:42px;display:grid;place-items:center;cursor:pointer;color:#fff;font-size:1.2rem;box-shadow:0 2px 12px rgba(0,0,0,.3);}
    .sidebar{width:228px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:0;height:100dvh;overflow-y:auto;z-index:1000;transition:transform .3s ease;}
    @media(max-width:900px){.sidebar{position:fixed;top:0;left:0;transform:translateX(-100%);}.sidebar.open{transform:translateX(0);}.welcome-card{padding-top:70px!important;}}
    @media(min-width:901px){.sidebar{position:relative;}.sidebar.collapsed{position:fixed;transform:translateX(-100%);}.sb-toggle{display:none!important;}}

    /* Avatar with ping */
    .sb-header{padding:16px 14px 0;display:flex;align-items:center;gap:10px;}
    .avatar-wrap{position:relative;width:38px;height:38px;flex-shrink:0;}
    .avatar-ring{width:38px;height:38px;border-radius:50%;border:2px solid #1a56db;background:#0a0f1e;display:flex;align-items:center;justify-content:center;}
    .avatar-logo{width:38px;height:38px;border-radius:50%;object-fit:cover;}
    .avatar-mid{width:20px;height:20px;border-radius:50%;background:#1a3a6e;display:flex;align-items:center;justify-content:center;}
    .avatar-dot{width:7px;height:7px;border-radius:50%;background:#409cff;position:relative;}
    .avatar-dot::before{content:'';position:absolute;inset:-4px;border-radius:50%;border:1.5px solid #409cff;opacity:0;animation:ping 2s ease-out infinite;}
    @keyframes ping{0%{opacity:0;transform:scale(1);}15%{opacity:.9;transform:scale(1);}80%{opacity:0;transform:scale(2.0);}100%{opacity:0;transform:scale(2.0);}}
    .avatar-online{position:absolute;bottom:0;right:0;width:8px;height:8px;border-radius:50%;background:#3fb950;border:1.5px solid var(--surface);}
    .sb-brand{flex:1;}
    .sb-brand-name{font-size:13px;font-weight:800;letter-spacing:.02em;}
    .sb-brand-name .nes{color:var(--nes-blue);}
    .sb-brand-name .ai{color:var(--text);}
    .sb-brand-sub{font-family:var(--mono);font-size:9px;color:var(--muted);margin-top:1px;}

    .sb-upgrade{background:var(--nes-btn-grad);border:none;border-radius:40px;padding:9px 16px;color:#fff;font-family:var(--ui);font-size:.78rem;font-weight:700;cursor:pointer;margin:12px 12px 4px;text-align:center;display:block;width:calc(100% - 24px);transition:opacity .2s;}
    .sb-upgrade:hover{opacity:.9;}

    .nav-section{padding:0 8px;margin-bottom:2px;}
    .nav-label{font-size:.6rem;color:var(--muted);letter-spacing:.1em;padding:10px 8px 4px;text-transform:uppercase;font-family:var(--mono);opacity:.7;}
    .nav{display:flex;flex-direction:column;gap:1px;}
    .nav-item{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:7px;cursor:pointer;color:var(--muted);font-size:.8rem;font-weight:600;transition:all .15s;border-left:2px solid transparent;}
    .nav-item:hover{background:var(--accent-lo);color:var(--accent);}
    .nav-item.active{background:var(--accent-lo);color:var(--nes-blue);border-left-color:var(--nes-blue);}
    .nav-item .ti{font-size:16px;width:18px;text-align:center;flex-shrink:0;}
    .nav-badge{margin-left:auto;font-size:.58rem;padding:1px 6px;border-radius:8px;font-weight:700;}
    .nb-blue{background:#0c1f35;color:var(--nes-blue);}
    .nb-green{background:#0d2818;color:#3fb950;}
    .nb-orange{background:#2d1b0e;color:#f0883e;}
    .nb-red{background:#2d0e0e;color:#f85149;}

    .sb-divider{height:1px;background:var(--border);margin:8px 12px;}

    /* Recent chats */
    .recent-item{display:flex;align-items:center;gap:8px;padding:5px 10px;border-radius:6px;cursor:pointer;margin-bottom:1px;}
    .recent-item:hover{background:var(--accent-lo);}
    .recent-item .ti{font-size:12px;color:var(--muted);opacity:.5;}
    .recent-item span{font-family:var(--mono);font-size:.68rem;color:var(--muted);}

    /* Client Manager btn */
    .client-mgr-btn{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:7px;cursor:pointer;color:var(--nes-blue);font-size:.8rem;font-weight:700;background:var(--accent-lo);border:1px solid var(--accent-md);margin:4px 8px;transition:all .15s;border-left:2px solid var(--nes-blue);}
    .client-mgr-btn:hover{background:var(--accent-md);}
    .client-mgr-btn .ti{font-size:16px;}

    .usage-wrap{margin-top:auto;padding:10px 12px 0;border-top:1px solid var(--border);}
    .usage-row{display:flex;justify-content:space-between;font-family:var(--mono);font-size:.6rem;color:var(--muted);margin-bottom:4px;}
    .usage-track{height:2px;background:var(--border);border-radius:99px;overflow:hidden;margin-bottom:10px;}
    .usage-fill{height:100%;background:var(--nes-blue);border-radius:99px;width:0%;}
    .user-row{display:flex;align-items:center;gap:7px;padding-bottom:12px;}
    .user-av{width:26px;height:26px;background:var(--accent-lo);border:1px solid var(--accent-md);border-radius:50%;display:grid;place-items:center;font-size:.65rem;color:var(--nes-blue);font-weight:700;}
    .user-email{font-family:var(--mono);font-size:.58rem;color:var(--muted);flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
    .role-chip{font-size:.52rem;padding:1px 6px;border-radius:6px;background:#0c1f35;color:var(--nes-blue);font-family:var(--mono);white-space:nowrap;}
    .logout-btn{background:none;border:1px solid var(--border);border-radius:6px;color:var(--muted);cursor:pointer;font-size:.7rem;padding:3px 7px;font-family:var(--mono);}
    .logout-btn:hover{border-color:#f85149;color:#f85149;}

    /* ── AUTH ── */
    #authScreen{position:fixed;inset:0;z-index:2000;background:var(--bg);display:flex;align-items:center;justify-content:center;}
    .auth-box{width:min(400px,90vw);background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:40px;}
    .auth-logo{font-size:1.6rem;font-weight:800;text-align:center;margin-bottom:4px;}
    .auth-logo .nes{color:var(--nes-blue);}
    .auth-logo .ai{color:var(--text);}
    .auth-sub{font-family:var(--mono);font-size:.7rem;color:var(--muted);text-align:center;margin-bottom:32px;}
    .auth-tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:24px;}
    .auth-tab{background:none;border:none;color:var(--muted);font-family:var(--ui);font-weight:600;padding:10px 20px;cursor:pointer;font-size:.85rem;}
    .auth-tab.active{color:var(--nes-blue);border-bottom:2px solid var(--nes-blue);}
    .auth-panel{display:none;flex-direction:column;gap:12px;}.auth-panel.active{display:flex;}
    .auth-input{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:12px 16px;color:var(--text);font-family:var(--mono);font-size:.85rem;outline:none;width:100%;}
    .auth-input:focus{border-color:var(--nes-blue);}
    .auth-btn{background:var(--nes-btn-grad);border:none;border-radius:12px;padding:12px;color:#fff;font-weight:700;cursor:pointer;font-size:.9rem;}
    .auth-err{font-family:var(--mono);font-size:.7rem;color:var(--red);min-height:18px;}

    /* ── APP ── */
    #app{display:none;width:100%;height:100dvh;overflow:hidden;}
    #app.visible{display:flex;}
    .main{flex:1;display:flex;flex-direction:column;height:100dvh;overflow:hidden;min-width:0;position:relative;}

    /* Top bar - only show relevant buttons per view */
    .top-bar{position:absolute;top:14px;right:18px;display:flex;gap:8px;z-index:100;}
    .top-btn{background:var(--surface);border:1px solid var(--border);border-radius:50%;width:36px;height:36px;display:grid;place-items:center;cursor:pointer;color:var(--nes-blue);font-size:1rem;}
    .top-btn:hover{background:var(--accent-lo);}
    .top-btn.danger:hover{background:rgba(248,81,73,.1);color:#f85149;border-color:#f85149;}

    .welcome-card{padding:12px 22px;border-bottom:1px solid var(--border);}
    .mode-label{font-family:var(--mono);font-size:.8rem;color:var(--nes-blue);font-weight:800;margin-bottom:2px;}
    .version-label{font-family:var(--mono);font-size:.65rem;color:var(--muted);}

    /* ── CHAT ── */
    .messages{flex:1;overflow-y:auto;padding:16px 22px;display:flex;flex-direction:column;gap:14px;}
    .msg{display:flex;gap:12px;animation:fadeIn .2s ease;}
    @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
    @keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-5px);opacity:1}}
    .msg.user{flex-direction:row-reverse;}

    /* Chat avatar with ping */
    .chat-av-wrap{position:relative;width:34px;height:34px;flex-shrink:0;}
    .chat-av-ring{width:34px;height:34px;border-radius:50%;border:2px solid #1a56db;background:#0a0f1e;display:flex;align-items:center;justify-content:center;}
    .chat-av-mid{width:18px;height:18px;border-radius:50%;background:#1a3a6e;display:flex;align-items:center;justify-content:center;}
    .chat-av-dot{width:6px;height:6px;border-radius:50%;background:#409cff;}
    .chat-av-online{position:absolute;bottom:0;right:0;width:7px;height:7px;border-radius:50%;background:#3fb950;border:1.5px solid var(--surface);}

    .user-av-msg{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:rgba(128,128,128,.12);border:1px solid var(--border);font-size:.72rem;font-weight:700;flex-shrink:0;}
    .msg-body{max-width:80%;position:relative;}
    .msg-role{font-family:var(--mono);font-size:.62rem;color:var(--muted);margin-bottom:4px;}
    .msg.user .msg-role{text-align:right;}
    .msg-bubble{padding:10px 15px;border-radius:16px;font-size:.88rem;line-height:1.65;}
    .msg.user .msg-bubble{background:var(--nes-btn-grad);color:#fff;border-bottom-right-radius:4px;}
    .msg.ai .msg-bubble{background:var(--surface);border:1px solid var(--border);border-bottom-left-radius:4px;}
    .sources-block{margin-top:6px;border-top:1px solid var(--border);padding-top:5px;font-size:.62rem;color:var(--muted);}
    .sources-block a{color:#60a5fa;text-decoration:none;}
    .copy-btn{position:absolute;top:-4px;right:0;background:var(--accent-lo);border-radius:7px;padding:2px 7px;font-size:.58rem;cursor:pointer;color:var(--nes-blue);opacity:0;border:none;}
    .msg-body:hover .copy-btn{opacity:1;}

    /* ── INPUT AREA ── */
    .input-area{padding:8px 22px 12px;border-top:1px solid var(--border);}
    .prompt-wrap{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:60px;padding:4px 4px 4px 16px;}
    .prompt-wrap:focus-within{border-color:var(--nes-blue);}
    #msgInput{flex:1;background:none;border:none;outline:none;color:var(--text);font-family:var(--ui);font-size:.92rem;padding:10px 0;}
    .send-btn{background:var(--nes-btn-grad);border:none;border-radius:50%;width:40px;height:40px;display:grid;place-items:center;cursor:pointer;color:#fff;font-size:1rem;}
    .send-btn:disabled{opacity:.4;}

    /* Bottom status bar */
    .bottom-bar{display:flex;justify-content:space-between;align-items:center;margin-top:7px;padding-top:7px;border-top:1px solid var(--border);gap:8px;}
    .bottom-left{display:flex;align-items:center;gap:8px;}
    .bottom-right{display:flex;align-items:center;gap:10px;}
    .status-dot{font-family:var(--mono);font-size:.7rem;color:var(--green);white-space:nowrap;display:flex;align-items:center;gap:4px;}
    .status-dot::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);}
    .status-dot.busy::before{background:var(--nes-blue);}
    .status-dot.busy{color:var(--nes-blue);}
    .disclaimer{font-family:var(--mono);font-size:.62rem;color:var(--muted);}
    .act-btn{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:4px 11px;font-size:.72rem;font-weight:600;color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:5px;}
    .act-btn:hover{background:var(--accent-lo);color:var(--nes-blue);}
    .act-btn .ti{font-size:13px;}
    .stat-item{display:flex;align-items:center;gap:4px;font-family:var(--mono);font-size:.7rem;color:var(--muted);}
    .stat-item .ti{font-size:13px;}
    .stat-item b{font-weight:700;}
    .stat-msgs b{color:var(--nes-blue);}
    .stat-imgs b{color:var(--purple);}
    .stat-docs b{color:var(--green);}

    /* ── PAGE (CEO, Leads etc) ── */
    .page{flex:1;overflow:hidden;background:var(--bg);}.page.scrollable{overflow-y:auto;padding:14px 18px;}
    .alert-bar{border-radius:8px;padding:8px 13px;margin-bottom:12px;display:flex;align-items:center;gap:8px;font-size:.78rem;font-weight:600;}
    .alert-bar .ti{font-size:14px;}
    .alert-warn{background:rgba(210,153,34,.1);border:1px solid rgba(210,153,34,.35);color:#d29922;}
    .alert-good{background:rgba(63,185,80,.1);border:1px solid rgba(63,185,80,.35);color:#3fb950;}

    /* KPI Cards */
    .kgrid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px;}.kgrid5{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:10px;}
    .kcard{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:11px 13px;}
    .kcard.hot{border-color:var(--nes-blue);}
    .kcard.warn{border-color:#d29922;}
    .kcard.danger{border-color:#f85149;}
    .klbl{font-size:.7rem;color:var(--muted);margin-bottom:3px;font-family:var(--mono);}
    .kval{font-size:1.45rem;font-weight:700;color:var(--text);line-height:1.1;}
    .kdelta{font-size:.68rem;margin-top:3px;font-family:var(--mono);}
    .kup{color:#3fb950;}.kdn{color:#f85149;}.kneu{color:var(--muted);}
    .kbar{height:2px;background:var(--border);border-radius:1px;margin-top:8px;overflow:hidden;}
    .kfill{height:100%;border-radius:1px;}

    /* Dashboard cards */
    .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
    .dash-card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:11px 13px;}
    .dc-title{font-family:var(--mono);font-size:.65rem;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px;}
    .pipe-track{height:5px;border-radius:3px;display:flex;gap:1px;overflow:hidden;margin-bottom:7px;}
    .pipe-seg{height:100%;}
    .pipe-legend{display:grid;grid-template-columns:repeat(2,1fr);gap:4px;}
    .pipe-item{display:flex;align-items:center;gap:4px;font-size:.68rem;color:var(--muted);font-family:var(--mono);}
    .pipe-dot{width:6px;height:6px;border-radius:1px;flex-shrink:0;}
    .pipe-num{color:var(--text);font-weight:600;}
    .geo-row{display:flex;align-items:center;gap:6px;margin-bottom:5px;}
    .geo-name{font-size:.7rem;color:var(--muted);width:65px;font-family:var(--mono);}
    .geo-track{flex:1;height:3px;background:var(--border);border-radius:2px;overflow:hidden;}
    .geo-fill{height:100%;border-radius:2px;}
    .geo-n{font-size:.7rem;color:var(--text);font-weight:600;width:18px;text-align:right;font-family:var(--mono);}

    /* Intelligence Feed */
    .intel-item{background:var(--card);border:1px solid var(--border);border-radius:7px;padding:8px 11px;margin-bottom:5px;display:flex;gap:8px;align-items:flex-start;}
    .itag{font-size:.6rem;padding:2px 6px;border-radius:4px;font-family:var(--mono);font-weight:700;white-space:nowrap;margin-top:1px;flex-shrink:0;}
    .itag-opp{background:#0d2818;color:#3fb950;}
    .itag-watch{background:#0c1f35;color:var(--nes-blue);}
    .itag-risk{background:#2d1f00;color:#d29922;}
    .ititle{font-size:.8rem;color:var(--text);line-height:1.4;font-weight:600;margin-bottom:2px;}
    .isub{font-size:.68rem;color:var(--muted);font-family:var(--mono);line-height:1.5;}

    /* Leads */
    .leads-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;}
    .leads-table{background:var(--card);border:1px solid var(--border);border-radius:8px;overflow:hidden;}
    .lt-header{display:grid;grid-template-columns:2fr 1.5fr 1fr 1fr 80px;gap:8px;padding:7px 13px;border-bottom:1px solid var(--border);font-family:var(--mono);font-size:.62rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;}
    .lt-row{display:grid;grid-template-columns:2fr 1.5fr 1fr 1fr 80px;gap:8px;padding:9px 13px;border-bottom:1px solid rgba(26,35,50,.5);align-items:center;}
    .lt-row:last-child{border-bottom:none;}
    .lt-row:hover{background:var(--accent-lo);}
    .lead-name{font-size:.8rem;color:var(--text);font-weight:600;}
    .lead-email{font-size:.65rem;color:var(--muted);font-family:var(--mono);}
    .lead-industry{font-size:.72rem;color:var(--muted);}
    .lead-time{font-size:.65rem;color:var(--muted);font-family:var(--mono);}
    .lead-badge{font-size:.6rem;padding:2px 8px;border-radius:8px;text-align:center;font-family:var(--mono);}
    .lbhot{background:#2d0e0e;color:#f85149;}
    .lbnew{background:#0c1f35;color:var(--nes-blue);}
    .lbwarm{background:#2d1f00;color:#d29922;}
    .tabs-bar{display:flex;gap:4px;margin-bottom:10px;}
    .tab-btn{font-size:.72rem;padding:4px 11px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;font-family:var(--mono);}

    .contact-name{font-size:.82rem;font-weight:600;color:var(--text);}
    .contact-meta{font-size:.68rem;color:var(--muted);font-family:var(--mono);}
    .deal-card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:6px;}
    .deal-name{font-size:.82rem;font-weight:600;color:var(--text);margin-bottom:3px;}
    .deal-meta{font-size:.68rem;color:var(--muted);font-family:var(--mono);display:flex;gap:10px;flex-wrap:wrap;}
    .deal-value{font-size:.9rem;font-weight:700;color:var(--nes-blue);}
    .stage-badge{font-size:.6rem;padding:2px 7px;border-radius:6px;font-family:var(--mono);font-weight:700;}
    .stage-lead{background:#0c1f35;color:#409cff;}
    .stage-qualified{background:#0d2818;color:#3fb950;}
    .stage-proposal{background:#2d1f00;color:#d29922;}
    .stage-negotiation{background:#2d1500;color:#f0883e;}
    .stage-won{background:#0d2818;color:#3fb950;}
    .stage-lost{background:#2d0e0e;color:#f85149;}
    .pipeline-board{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:12px;overflow-x:auto;}
    .pipeline-col{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px;min-width:140px;}
    .pipeline-col-title{font-size:.65rem;font-family:var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px;text-align:center;}
    .pipeline-deal{background:var(--card2);border:1px solid var(--border);border-radius:6px;padding:7px 9px;margin-bottom:5px;}
    .pipeline-deal-name{font-size:.72rem;font-weight:600;color:var(--text);margin-bottom:2px;}
    .pipeline-deal-val{font-size:.7rem;color:var(--nes-blue);font-family:var(--mono);}
    .comm-row{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 80px;gap:8px;padding:9px 13px;border-bottom:1px solid rgba(26,35,50,.5);align-items:center;font-size:.78rem;}
    .comm-header{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 80px;gap:8px;padding:7px 13px;border-bottom:1px solid var(--border);font-family:var(--mono);font-size:.62rem;color:var(--muted);text-transform:uppercase;}
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:2000;display:flex;align-items:center;justify-content:center;}
    .modal-box{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px;width:min(500px,90vw);max-height:80vh;overflow-y:auto;}
    .modal-title{font-size:1rem;font-weight:700;color:var(--text);margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;}
    /* Toast */
    .toast{position:fixed;bottom:24px;right:24px;background:var(--surface);border:1px solid var(--border);color:var(--text);font-family:var(--mono);font-size:.75rem;padding:9px 16px;border-radius:8px;z-index:9999;animation:fadeIn .2s ease;box-shadow:0 4px 16px rgba(0,0,0,.3);}

    @media(max-width:700px){
      .welcome-card,.messages,.input-area{padding-left:12px;padding-right:12px;}
      .disclaimer{display:none;}
      .kgrid3{grid-template-columns:1fr 1fr;}

      .bottom-bar{flex-wrap:wrap;gap:5px;}
      .stat-item{font-size:.62rem;}
      .stat-item b{font-size:.62rem;}
    }
  </style>
</head>

sb.auth.onAuthStateChange((_e,s)=>{session=s;s?showApp(s.user):showAuthScreen();});

async function showApp(user){
  document.getElementById('authScreen').style.display='none';
  document.getElementById('app').style.display='flex';
  document.getElementById('userEmail').textContent=user.email;
  document.getElementById('userInitial').textContent=user.email[0].toUpperCase();

// Recent chats
function saveRecentChat(label){
  let rc=[];try{rc=JSON.parse(localStorage.getItem(STORAGE_KEYS.rc)||'[]');}catch(e){}
  const now=new Date();
  const today=now.toDateString();
  // Save current history snapshot with this chat
  const historySnapshot=JSON.stringify(history.slice(-30));
  const msgSnapshot=allMsgsHTML;
  const existing=rc.find(r=>r.date===today);
  if(existing){
    existing.time=now.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
    existing.label=label||existing.label;
    existing.history=historySnapshot;
    existing.msgs=msgSnapshot;
  } else {
    rc.unshift({date:today,time:now.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}),label:label||'Chat',history:historySnapshot,msgs:msgSnapshot});
  }
  rc=rc.slice(0,5);
  localStorage.setItem(STORAGE_KEYS.rc,JSON.stringify(rc));
  loadRecentChats();
}

function loadRecentChats(){
  let rc=[];try{rc=JSON.parse(localStorage.getItem(STORAGE_KEYS.rc)||'[]');}catch(e){}
  const el=document.getElementById('recentChats');if(!el)return;
  if(!rc.length){el.innerHTML='<div style="padding:4px 10px;font-family:var(--mono);font-size:.65rem;color:#484f58">No recent chats</div>';return;}
  const today=new Date().toDateString();
  const yesterday=new Date(Date.now()-86400000).toDateString();
  el.innerHTML=rc.map(r=>{
    let lbl=r.date===today?'Today '+r.time:r.date===yesterday?'Yesterday '+r.time:new Date(r.date).toLocaleDateString('en-GB',{day:'numeric',month:'short'})+' '+r.time;
    return`<div class="recent-item" onclick="restoreChat(${rc.indexOf(r)})" title="${r.label||'Chat'}"><i class="ti ti-clock"></i><span>${lbl}</span></div>`;
  }).join('');
}

function restoreChat(idx){
  let rc=[];try{rc=JSON.parse(localStorage.getItem(STORAGE_KEYS.rc)||'[]');}catch(e){}
  const chat=rc[idx||0];
  if(chat&&chat.history){
    try{history=JSON.parse(chat.history);}catch(e){history=[];}
    allMsgsHTML=chat.msgs||'';
  }
  showView('chat');
}

function bindNav(){
  document.querySelectorAll('.nav-item[data-view]').forEach(item=>{
    item.addEventListener('click',()=>{
      const v=item.dataset.view;
      document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
      item.classList.add('active');
      showView(v);
      if(window.innerWidth<=900)document.getElementById('sidebar').classList.remove('open');
    });
  });
}

function showView(view){
  currentView=view;
  localStorage.setItem('nesai_view',view);
  // Hide team hub if switching away
  if(view!=='command'&&window._teamHubVisible)hideTeamHub();
  // Show/hide clear button — only for chat views
  const clearBtn=document.getElementById('clearBtn');
  if(clearBtn)clearBtn.style.display=['chat','deepcore','docs','image'].includes(view)?'grid':'none';
  if(['chat','deepcore','docs','image'].includes(view)){showChatInterface(view);}
  else if(view==='ceo'){showCEODashboard();}
  else if(view==='command'){showCommandCentre();}
  else if(view==='leads'){showLeadsPage();}
  else if(view==='clientmgr'){showClientManager();}
  else if(view==='sales'){showSalesPortal();}
  else if(view==='mycredentials'){showMyCredentials();}
  else if(view==='adminstatus'){showAdminStatus();}
  else if(view==='apicredits'){showApiCredits();}
  else if(view==='pricing'){showPricing();}
}

async function loadApiSummary(){
  try{
    const{data}=await sb.from('api_credits').select('service_name,current_balance,monthly_usage,status').neq('status','inactive');
    if(!data)return;
    const healthy=data.filter(r=>r.status==='healthy').length;
    const total=data.length;
    const allOk=healthy===total;
    const hasWarning=data.some(r=>r.status==='low');
    const hasCritical=data.some(r=>r.status==='critical'||r.status==='unknown');
    const healthColor=hasCritical?'#f85149':hasWarning?'#d29922':'#3fb950';
    const healthText=hasCritical?'Critical':hasWarning?'Warning':'All OK';
    const healthPct=Math.round((healthy/total)*100);
    const el=document.getElementById('apiHealthVal');
    const delta=document.getElementById('apiHealthDelta');
    const bar=document.getElementById('apiHealthBar');
    if(el){el.textContent=healthText;el.style.color=healthColor;}
    if(delta)delta.textContent=healthy+'/'+total+' services healthy';
    if(bar){bar.style.width=healthPct+'%';bar.style.background=healthColor;}
    // Credits total
    const totalBalance=data.reduce((sum,r)=>sum+(parseFloat(r.current_balance)||0),0);
    const totalUsage=data.reduce((sum,r)=>sum+(parseFloat(r.monthly_usage)||0),0);
    const cv=document.getElementById('creditVal');
    const cd=document.getElementById('creditDelta');
    const cb=document.getElementById('creditBar');
    if(cv)cv.textContent='$'+totalBalance.toFixed(2);
    if(cd)cd.textContent='Used $'+totalUsage.toFixed(2)+' this month';
    if(cb)cb.style.width=Math.min(100,Math.round((totalUsage/(totalBalance+totalUsage+0.01))*100))+'%';
  }catch(e){}
}

async function loadCeoFeed(){
  try{
    let feedQ=sb.from('ceo_feed').select('*').order('created_at',{ascending:false}).limit(20);
    if(userClientId)feedQ=feedQ.eq('client_id',userClientId);
    const{data,error}=await feedQ;
    const el=document.getElementById('ceoFeedItems');
    if(!el)return;
    if(error||!data||data.length===0){
      el.innerHTML='<div style="color:var(--muted);font-family:var(--mono);font-size:.7rem;padding:10px 0;">No intelligence feed data yet. Check back after 6AM tomorrow.</div>';
      return;
    }
    // Unread tracking
    const lastRead=localStorage.getItem('nesai_feed_lastread')||'';
    const lastReadTime=lastRead?new Date(lastRead):new Date(0);
    const unreadItems=data.filter(function(item){return new Date(item.created_at)>lastReadTime;});
    const unreadBadge=document.getElementById('feedUnreadBadge');
    if(unreadBadge){
      if(unreadItems.length>0){unreadBadge.textContent=unreadItems.length+' NEW';unreadBadge.style.display='block';}
      else{unreadBadge.style.display='none';}
    }
    const tagColors={briefing:'#409cff',intelligence:'#3fb950',default:'#d29922'};
    const tagLabels={briefing:'BRIEF',intelligence:'INTEL',default:'INFO'};
    el.innerHTML=data.map(function(item,idx){
      const tagColor=tagColors[item.type]||tagColors.default;
      const tagLabel=tagLabels[item.type]||tagLabels.default;
      // Extract URLs from content — handles href="..." and plain text
      const urls=[];
      if(item.content){
        var hrefRe=/href=["']([^"']+)["']/g;
        var hm;
        while((hm=hrefRe.exec(item.content))!==null){
          if(hm[1].indexOf('http')===0){try{new URL(hm[1]);urls.push(hm[1]);}catch(e){}}
        }
        if(urls.length===0){
          item.content.split(/\s+/).forEach(function(word){
            var w=word.replace(/[^a-zA-Z0-9/:._?=&%-]/g,'');
            if(w.indexOf('http')===0){try{new URL(w);urls.push(w);}catch(e){}}
          });
        }
      }
      // Clean content for preview
      const cleaned=item.content
        ?item.content
          .replace(/https?:\/\/\S+/g,'')
          .replace(/\*/g,'')
          .replace(/---+/g,'')
          .replace(/🔗/g,'')
          .replace(/\s+/g,' ')
          .trim()
        :'';
      // Split into sections for expand view
      const sections=cleaned.split('  ').filter(function(s){return s.trim().length>10;});
      const preview=sections.slice(0,2).join(' ').substring(0,160)+'...';
      const uniqueUrls=[...new Set(urls)].slice(0,4);
      const sourceHtml=uniqueUrls.length
        ?'<div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:5px;">'+
          uniqueUrls.map(function(u){
            var label=u;try{label=new URL(u).hostname.replace('www.','');}catch(e){}
            return '<a href="'+u+'" target="_blank" rel="noopener" style="font-size:.62rem;font-family:var(--mono);padding:2px 7px;border-radius:5px;background:var(--bg);border:1px solid var(--border);color:var(--nes-blue);text-decoration:none;cursor:pointer;">'+label+'</a>';
          }).join('')+'</div>'
        :'';
      const expandedHtml=sections.map(function(s){
        return '<p style="margin:0 0 8px;line-height:1.6;font-size:.82rem;color:var(--text);">'+s.trim()+'</p>';
      }).join('');
      const isNew=new Date(item.created_at)>lastReadTime;
      const isToday=new Date(item.created_at).toDateString()===new Date().toDateString();
      let dividerHtml='';
      if(idx===0){dividerHtml='<div style="text-align:center;font-family:var(--mono);font-size:.58rem;color:var(--muted);padding:4px 0 6px;display:flex;align-items:center;gap:6px;margin-bottom:4px;"><div style=\"flex:1;height:1px;background:var(--border)\"></div>Today<div style=\"flex:1;height:1px;background:var(--border)\"></div></div>';}
      else if(!isToday&&new Date(data[idx-1]?.created_at).toDateString()===new Date().toDateString()){dividerHtml='<div style="text-align:center;font-family:var(--mono);font-size:.58rem;color:var(--muted);padding:4px 0 6px;display:flex;align-items:center;gap:6px;margin-bottom:4px;"><div style=\"flex:1;height:1px;background:var(--border)\"></div>Earlier<div style=\"flex:1;height:1px;background:var(--border)\"></div></div>';}
      return dividerHtml+'<div class="feed-card" id="feed-'+idx+'" style="background:'+(isNew?'#0c1827':'var(--surface)')+';border:1px solid '+(isNew?'#409cff33':'var(--border)')+';border-radius:12px;margin-bottom:8px;overflow:hidden;">'+
        '<div style="display:flex;align-items:flex-start;gap:10px;padding:12px 14px;cursor:pointer;" onclick="toggleFeedItem('+idx+')">'+
        (isNew?'<div style="width:7px;height:7px;border-radius:50%;background:#409cff;flex-shrink:0;margin-top:5px;" class="feed-new-dot-'+idx+'"></div>':'')+
        '<div style="width:32px;height:32px;border-radius:50%;border:2px solid #1a56db;background:#0a0f1e;display:flex;align-items:center;justify-content:center;flex-shrink:0;">'+
        '<div style="width:16px;height:16px;border-radius:50%;background:#1a3a6e;display:flex;align-items:center;justify-content:center;">'+
        '<div style="width:6px;height:6px;border-radius:50%;background:#409cff;"></div></div></div>'+
        '<div style="flex:1;min-width:0;">'+
        '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;">'+

        '<div style="display:flex;align-items:center;gap:6px;">'+
        '<span style="font-size:.6rem;font-family:var(--mono);padding:2px 7px;border-radius:5px;background:'+
        (item.type==='intelligence'?'#0d2818':'#0c1f35')+';color:'+tagColor+';">'+tagLabel+'</span>'+
        '<span style="font-size:.6rem;color:var(--muted);font-family:var(--mono);">'+
        new Date(item.created_at).toLocaleDateString('en-GB',{day:'numeric',month:'short'})+'</span>'+
        '<i class="ti ti-chevron-down feed-chevron-'+idx+'" style="font-size:12px;color:var(--muted);transition:transform .2s;"></i>'+
        '</div></div>'+
        '<div style="font-size:.8rem;font-weight:600;color:var(--text);margin-bottom:4px;">'+
        (function(){
          if(!item.content)return item.title||'Intelligence Update';
          var lines=item.content.split('\n').map(function(l){return l.trim();});
          var skipWords=['NES INTELLIGENCE','NES AI','Oman •','GCC •','Global Tech','AST','━','OMAN & GCC','AI & TECH','BUSINESS & ECO','MARKET INSIGHT','MORNING BRIEF','Intelligence Feed','CEO Briefing','---','http','🌐','📰','🔵','•'];
          for(var i=0;i<lines.length;i++){
            var l=lines[i];
            // Must be 15-100 chars, not a header/meta line
            if(l.length>=15&&l.length<=100){
              var skip=false;
              for(var j=0;j<skipWords.length;j++){if(l.includes(skipWords[j])){skip=true;break;}}
              if(!skip){
                // Clean leading symbols
                var clean=l.replace(/^[*🔹◆·🔷📅👥☀️⛅🌧️🌫️🌤️⚙️📡☕🕌🌅\s]+/,'').trim();
                if(clean.length>=15)return clean.substring(0,80);
              }
            }
          }
          return item.title||'Intelligence Update';
        }())+'</div>'+
        '<div class="feed-preview-'+idx+'" style="font-size:.75rem;color:var(--muted);line-height:1.5;">'+preview+'</div>'+
        sourceHtml+
        '</div></div>'+
        '<div class="feed-expanded-'+idx+'" style="display:none;padding:0 14px 14px 56px;border-top:1px solid var(--border);">'+
        '<div style="padding-top:12px;">'+expandedHtml+'</div>'+
        (uniqueUrls.length?'<div style="font-family:var(--mono);font-size:.62rem;color:var(--muted);margin-top:8px;margin-bottom:4px;text-transform:uppercase;letter-spacing:.08em;">Sources</div>'+
        '<div style="display:flex;flex-wrap:wrap;gap:5px;">'+
        uniqueUrls.map(function(u){
          var label=u;try{label=new URL(u).hostname.replace('www.','');}catch(e){}
          return '<a href="'+u+'" target="_blank" rel="noopener" style="font-size:.62rem;font-family:var(--mono);padding:2px 8px;border-radius:5px;background:var(--bg);border:1px solid var(--border);color:var(--nes-blue);text-decoration:none;">'+label+'</a>';
        }).join('')+'</div>':'')+
        '</div></div>';
    }).join('');
    // Mark as read on scroll to bottom
    const feedEl=document.getElementById('ceoFeedItems');
    if(feedEl){
      feedEl.onscroll=function(){
        if(feedEl.scrollTop+feedEl.clientHeight>=feedEl.scrollHeight-50){
          localStorage.setItem('nesai_feed_lastread',new Date().toISOString());
          document.querySelectorAll('[class^="feed-new-dot"]').forEach(function(d){d.style.opacity='0';});
          if(unreadBadge)unreadBadge.style.display='none';
        }
      };
    }
  }catch(e){
    const el=document.getElementById('ceoFeedItems');
    if(el)el.innerHTML='<div style="color:var(--muted);font-family:var(--mono);font-size:.7rem;padding:10px 0;">Feed unavailable.</div>';
  }
}

function toggleFeedItem(idx){
  const preview=document.querySelector('.feed-preview-'+idx);
  const expanded=document.querySelector('.feed-expanded-'+idx);
  const chevron=document.querySelector('.feed-chevron-'+idx);
  if(!expanded)return;
  const isOpen=expanded.style.display!=='none';
  expanded.style.display=isOpen?'none':'block';
  if(preview)preview.style.display=isOpen?'block':'none';
  if(chevron)chevron.style.transform=isOpen?'':'rotate(180deg)';
}

function detectCountry(email){
  if(email.endsWith('.om')||email.includes('oman'))return'Oman';
  if(email.endsWith('.ae')||email.includes('uae')||email.includes('dubai'))return'UAE';
  if(email.endsWith('.sa')||email.includes('saudi'))return'Saudi Arabia';
  if(email.endsWith('.kw'))return'Kuwait';
  if(email.endsWith('.bh'))return'Bahrain';
  if(email.endsWith('.qa'))return'Qatar';
  if(email.endsWith('.uk')||email.endsWith('.co.uk'))return'UK';
  if(email.endsWith('.de'))return'Germany';
  if(email.endsWith('.pk'))return'Pakistan';
  if(email.endsWith('.ca'))return'Canada';
  if(email.endsWith('.fr'))return'France';
  if(email.endsWith('.in'))return'India';
  if(email.endsWith('.jo'))return'Jordan';
  if(email.endsWith('.eg'))return'Egypt';
  if(email.endsWith('.us'))return'USA';
  return'Oman';
}

  return leads.map(l=>{
    const date=new Date(l.created_at);const timeAgo=getTimeAgo(date);const badge=getBadge(l,date);
    return`<div class="lt-row"><div><div class="lead-name">${l.name||'—'}</div><div class="lead-email">${l.email||'—'}</div></div><div class="lead-industry">${l.industry||'General'}</div><div class="lead-email">${l.phone||'—'}</div><div class="lead-time">${timeAgo}</div><div><span class="lead-badge ${badge.cls}">${badge.label}</span></div></div>`;
  }).join('');
}

function getBadge(lead,date){
  const hrs=(Date.now()-date.getTime())/3600000;
  const highValue=['Government','Ports & Customs','Aviation & Airports'].includes(lead.industry);
  if(highValue&&hrs<24)return{cls:'lbhot',label:'Hot'};
  if(hrs<24)return{cls:'lbnew',label:'New'};
  return{cls:'lbwarm',label:'Warm'};
}

function getTimeAgo(date){
  const hrs=Math.floor((Date.now()-date.getTime())/3600000);
  if(hrs<1)return'Just now';if(hrs<24)return hrs+'h ago';
  return Math.floor(hrs/24)+'d ago';
}

function filterLeads(filter,btn){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');
  let filtered=window._allLeads||[];
  if(filter==='today')filtered=filtered.filter(l=>l.created_at?.startsWith(new Date().toISOString().split('T')[0]));
  if(filter==='week')filtered=filtered.filter(l=>new Date(l.created_at)>new Date(Date.now()-7*24*60*60*1000));
  document.getElementById('leadsRows').innerHTML=renderLeadRows(filtered);
}

function exportLeads(){
  const leads=window._allLeads||[];
  const csv=['Name,Email,Phone,Industry,Country,Message,Date',...leads.map(l=>`"${l.name||''} ","${l.email||''} ","${l.phone||''} ","${l.industry||''} ","${l.country||''} ","${(l.message||'').replace(/"/g,"'")}" ,"${l.created_at||''} "`)].join('\n');
  const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);a.download='nes-leads-'+new Date().toISOString().split('T')[0]+'.csv';a.click();
}

async function loadClientsFromDB(){

async function saveClientCreds(id){
  const creds={};
  document.querySelectorAll('#cm-creds [data-field]').forEach(el=>{
    if(el.dataset.field) creds[el.dataset.field]=el.value.trim();
  });
  const btn=document.querySelector('#cm-creds .form-submit');
  if(btn){btn.disabled=true;btn.textContent='Saving...';}
  try{
    const res=await fetch(API_URL+'/api/client/'+id+'/credentials',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token},
      body:JSON.stringify({credentials:creds})
    });
    if(!res.ok){const e=await res.json();throw new Error(e.error||'Save failed');}
    showToast('Credentials saved ✓');
    // Refresh client data
    await loadClientsFromDB();
  }catch(e){alert('Error saving credentials: '+e.message);}
  finally{if(btn){btn.disabled=false;btn.innerHTML='<i class="ti ti-device-floppy"></i> Save Credentials';}}
}

async function selectClientDB(id){
  window._activeClientId=id;
  // Load decrypted credentials from backend
  try{
    const res=await fetch(API_URL+'/api/client/'+id+'/credentials',{
      headers:{'Authorization':'Bearer '+session.access_token}
    });
    console.log('Credentials API response:',res.status,res.url);
    if(res.ok){
      const data=await res.json();
      console.log('Credentials loaded:',Object.keys(data));
      if(!window._clientCreds)window._clientCreds={};
      const creds=data.credentials&&typeof data.credentials==='string'?JSON.parse(data.credentials):data.credentials||{};
      const setts=data.settings&&typeof data.settings==='string'?JSON.parse(data.settings):data.settings||{};
      window._clientCreds[id]={...creds,...setts};
      console.log('Merged creds keys:',Object.keys(window._clientCreds[id]));
    }else{
      const err=await res.json().catch(()=>({}));
      console.error('Credentials API error:',res.status,err);
    }
  }catch(e){console.error('Could not load credentials:',e.message,e);}
  await loadClientsFromDB();
}

function getFormData(){
  const fields=['name','email','website','industry','region','country','language','lead_email','primary_color','logo_url','plan','status','trial_start','trial_duration_days'];
  const data={};
  fields.forEach(f=>{const el=document.getElementById('field_'+f);if(el)data[f]=el.value.trim();});
  return data;
}

async function saveNewClient(){
  const data=getFormData();if(!data.name){alert('Company name is required');return;}
  const btn=document.querySelector('.form-submit');if(btn){btn.disabled=true;btn.textContent='Creating...';}
  try{const{error}=await sb.from('clients').insert([data]);if(error)throw error;window._activeClientId=null;await showClientManager();showToast('Client created');}
  catch(e){alert('Error: '+e.message);if(btn){btn.disabled=false;btn.innerHTML='<i class="ti ti-plus"></i> Create Client';}}
}

async function updateClient(clientId){
  const data=getFormData();if(!data.name){alert('Company name is required');return;}
  const btn=document.querySelector('.form-submit');if(btn){btn.disabled=true;btn.textContent='Saving...';}
  try{const{error}=await sb.from('clients').update(data).eq('id',clientId);if(error)throw error;window._activeClientId=clientId;await showClientManager();showToast('Client updated');}
  catch(e){alert('Error: '+e.message);if(btn){btn.disabled=false;btn.innerHTML='<i class="ti ti-device-floppy"></i> Save Changes';}}
}

async function deleteClient(clientId){
  const client=(window._clients||[]).find(c=>c.id===clientId);
  if(!confirm(`Delete "${client?.name||'this client'}"? This cannot be undone.`))return;
  try{const{error}=await sb.from('clients').delete().eq('id',clientId);if(error)throw error;window._activeClientId=null;await showClientManager();showToast('Client deleted');}
  catch(e){alert('Error: '+e.message);}
}

  });
  html+='</div>';
  html+=`<div id="addApiForm" style="display:none;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:20px;"><div style="font-family:var(--mono);font-size:.72rem;color:var(--nes-blue);font-weight:700;margin-bottom:12px;">Add New API</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;"><div><div style="font-family:var(--mono);font-size:.65rem;color:var(--muted);margin-bottom:4px;">Service name</div><input id="new_api_name" class="form-input" placeholder="e.g. Stripe" style="font-size:.78rem;"></div><div><div style="font-family:var(--mono);font-size:.65rem;color:var(--muted);margin-bottom:4px;">Balance ($)</div><input id="new_api_balance" class="form-input" type="number" placeholder="0.00" style="font-size:.78rem;"></div><div><div style="font-family:var(--mono);font-size:.65rem;color:var(--muted);margin-bottom:4px;">Alert threshold ($)</div><input id="new_api_threshold" class="form-input" type="number" placeholder="5" style="font-size:.78rem;"></div><div><div style="font-family:var(--mono);font-size:.65rem;color:var(--muted);margin-bottom:4px;">Notes</div><input id="new_api_notes" class="form-input" placeholder="What it is used for" style="font-size:.78rem;"></div></div><div style="display:flex;gap:8px;margin-top:10px;"><button onclick="saveNewApiService()" style="background:var(--nes-btn-grad);border:none;border-radius:7px;padding:7px 16px;color:#fff;font-size:.75rem;font-weight:700;cursor:pointer;"><i class="ti ti-plus"></i> Add</button><button onclick="document.getElementById('addApiForm').style.display='none'" style="background:none;border:1px solid var(--border);border-radius:7px;padding:7px 14px;color:var(--muted);cursor:pointer;font-size:.75rem;">Cancel</button></div></div>`;

function addApiService(){const f=document.getElementById('addApiForm');if(f)f.style.display=f.style.display==='none'?'block':'none';}

async function saveNewApiService(){
  const name=document.getElementById('new_api_name')?.value.trim();
  const balance=parseFloat(document.getElementById('new_api_balance')?.value)||0;
  const threshold=parseFloat(document.getElementById('new_api_threshold')?.value)||5;
  const notes=document.getElementById('new_api_notes')?.value.trim();
  if(!name){showToast('Service name required');return;}
  try{await sb.from('api_credits').insert([{service_name:name,current_balance:balance,alert_threshold:threshold,notes,status:balance<threshold?'low':'healthy'}]);showToast('API added');document.getElementById('addApiForm').style.display='none';await loadApiCredits();}catch(e){showToast('Error: '+e.message);}
}

async function updateApiBalance(id,val){
  const balance=parseFloat(val)||0;const threshold=parseFloat(document.getElementById('thr_'+id)?.value)||5;
  try{await sb.from('api_credits').upsert({service_name:id,current_balance:balance,status:balance<threshold?'low':'healthy'},{onConflict:'service_name'});}catch(e){}
}

async function saveAllThresholds(){
  const apis=window._apisList||[];
  const btn=document.querySelector('[onclick="saveAllThresholds()"]');
  if(btn){btn.disabled=true;btn.textContent='Saving...';}
  try{
    for(const api of apis){
      const balance=parseFloat(document.getElementById('bal_'+api.id)?.value)||0;
      const threshold=parseFloat(document.getElementById('thr_'+api.id)?.value)||5;
      const rechargeAt=parseFloat(document.getElementById('rat_'+api.id)?.value)||5;
      const rechargeAmt=parseFloat(document.getElementById('ram_'+api.id)?.value)||20;
      await sb.from('api_credits').upsert({service_name:api.id,current_balance:balance,alert_threshold:threshold,recharge_at:rechargeAt,recharge_amount:rechargeAmt,status:balance===0?'unknown':balance<threshold?'low':'healthy'},{onConflict:'service_name'});
    }
    showToast('Thresholds saved');await loadApiCredits();
  }catch(e){showToast('Error: '+e.message);}
  finally{if(btn){btn.disabled=false;btn.innerHTML='<i class="ti ti-device-floppy"></i> Save Thresholds';}}
}

function showToast(msg){
  const t=document.createElement('div');t.className='toast';t.textContent=msg;
  document.body.appendChild(t);setTimeout(()=>t.remove(),2800);
}

async function sendMsg(){
  if(busy||!session)return;
  const input=document.getElementById('msgInput');const text=input.value.trim();if(!text)return;
  const limits=getCurrentLimits();
  if(chatUsed>=limits.messages&&limits.messages!==-1){addAiMsg('Daily limit reached. Come back tomorrow!');return;}
  input.value='';setBusy(true);appendMsg(userBubble(text));history.push({role:'user',content:text});addTyping();
  saveRecentChat(text.substring(0,30));

  // Image mode — no streaming
  if(currentView==='image'){
    try{
      const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),45000);
      const res=await fetch(API_URL+'/api/image',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token},body:JSON.stringify({prompt:text}),signal:controller.signal});
      clearTimeout(timeout);removeTyping();
      if(res.ok){const data=await res.json();appendMsg(imgBubble(data.url,data.revisedPrompt||text));imagesUsed++;}
      else{const err=await res.json().catch(()=>({}));addAiMsg('Error '+(err.error||res.status)+'. Please try again.');}
      saveHistory();saveUsage();updateStats();
    }catch(e){removeTyping();addAiMsg('Network error. Please check your connection.');}
    setBusy(false);return;
  }

  // Chat modes — streaming via SSE
  try{
    const useSearch=['chat','deepcore'].includes(currentView);
    const res=await fetch(API_URL+'/api/chat/stream',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token},
      body:JSON.stringify({message:text,mode:currentView,webSearch:useSearch,history:history.slice(-10)})
    });

    if(!res.ok){
      removeTyping();
      const err=await res.json().catch(()=>({}));
      addAiMsg('Error '+(err.error||res.status)+'. Please try again.');
      setBusy(false);return;
    }

    // Create streaming bubble
    removeTyping();
    const bubbleId='stream-'+Date.now();
    const bubbleHTML=`<div class="msg ai" id="${bubbleId}"><div class="chat-av-wrap"><div class="chat-av-ring"><div class="chat-av-mid"><div class="chat-av-dot"></div></div></div><div class="chat-av-online"></div></div><div class="msg-body"><div class="msg-role">NES AI</div><div class="msg-bubble" id="${bubbleId}-text"></div><button class="copy-btn" onclick="copyMsg(this)">Copy</button></div></div>`;
    document.getElementById('messages')?.insertAdjacentHTML('beforeend',bubbleHTML);
    scroll();

    const reader=res.body.getReader();
    const decoder=new TextDecoder();
    let fullReply='';
    let sources=[];
    let buffer='';

    while(true){
      const{done,value}=await reader.read();
      if(done)break;
      buffer+=decoder.decode(value,{stream:true});
      const lines=buffer.split('\n');
      buffer=lines.pop()||'';
      for(const line of lines){
        if(!line.startsWith('data: '))continue;
        try{
          const data=JSON.parse(line.slice(6));
          if(data.type==='sources'){sources=data.sources||[];}
          else if(data.type==='chunk'){
            fullReply+=data.text;
            const el=document.getElementById(bubbleId+'-text');
            if(el){el.innerHTML=md(cleanDisplay(fullReply));}
            scroll();
          }
          else if(data.type==='done'){
            // Add sources if any
            if(sources.length){
              const el=document.getElementById(bubbleId+'-text');
              if(el){
                const src='<div class="sources-block">Sources: '+sources.map(s=>'<a href="'+esc(s.url)+'" target="_blank">'+esc(s.title||s.url)+'</a>').join(' · ')+'</div>';
                el.innerHTML=md(cleanDisplay(fullReply))+src;
              }
            }
            history.push({role:'assistant',content:fullReply,sources});
            chatUsed++;saveHistory();saveUsage();updateStats();
          }
        }catch(e){}
      }
    }

    // If nothing streamed — fallback message
    if(!fullReply){addAiMsg('Sorry, I could not generate a response.');}

  }catch(e){removeTyping();addAiMsg('Network error. Please check your connection.');}
  setBusy(false);
}

function handleAttach(){
  if(currentView!=='docs'){addAiMsg('File attachment is available in Documents mode.');return;}
  const inp=document.createElement('input');inp.type='file';inp.accept='.txt,.md,.json,.csv,.pdf,.docx,.xlsx,.xls';inp.onchange=e=>processFile(e.target.files[0]);inp.click();
}
async function processFile(file){
  if(!file)return;if(file.size>10*1024*1024){addAiMsg('File too large. Max 10MB.');return;}
  appendMsg(userBubble('Attached: '+file.name+' ('+Math.round(file.size/1024)+' KB) — analyzing…'));setBusy(true);addTyping();
  try{
    const content=await extractText(file);if(!content.trim()){removeTyping();addAiMsg('Could not extract text.');setBusy(false);return;}
    const truncated=content.substring(0,7000);
    history.push({role:'user',content:'Analyze: "'+file.name+'":\n'+truncated});
    const res=await fetch(API_URL+'/api/chat',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token},body:JSON.stringify({message:'Analyze and transcribe this document "'+file.name+'". Provide the full content, key information, and a summary. Do not introduce yourself.\n\nContent:\n'+truncated,mode:'docs',webSearch:false,history:history.slice(-4)})});
    removeTyping();
    if(res.ok){const data=await res.json();const reply=data.reply||'Document analyzed.';history.push({role:'assistant',content:reply});appendMsg(aiBubble(reply));docsUsed++;}
    else{addAiMsg('Could not analyze file.');}
    saveHistory();saveUsage();updateStats();
  }catch(err){removeTyping();addAiMsg('Error: '+err.message);}
  setBusy(false);
}
async function extractText(file){
  const ext=file.name.split('.').pop().toLowerCase();
  if(['txt','md','json','csv'].includes(ext))return file.text();
  if(ext==='pdf'){if(typeof pdfjsLib==='undefined')await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';const ab=await file.arrayBuffer();const pdf=await pdfjsLib.getDocument({data:ab}).promise;const pages=[];for(let i=1;i<=Math.min(pdf.numPages,20);i++){const page=await pdf.getPage(i);const tc=await page.getTextContent();pages.push(tc.items.map(s=>s.str).join(' '));}return pages.join('\n');}
  if(ext==='docx'){if(typeof mammoth==='undefined')await loadScript('https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js');const ab=await file.arrayBuffer();const r=await mammoth.extractRawText({arrayBuffer:ab});return r.value;}
  if(['xlsx','xls'].includes(ext)){if(typeof XLSX==='undefined')await loadScript('https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js');const ab=await file.arrayBuffer();const wb=XLSX.read(ab);return wb.SheetNames.map(n=>'Sheet: '+n+'\n'+XLSX.utils.sheet_to_csv(wb.Sheets[n])).join('\n\n');}
  throw new Error('Unsupported file type');
}
function loadScript(src){return new Promise((resolve,reject)=>{if(document.querySelector('script[src="'+src+'"]'))  {resolve();return;}const s=document.createElement('script');s.src=src;s.onload=resolve;s.onerror=reject;document.head.appendChild(s);});}
function toggleVoice(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){addAiMsg('Voice not supported in this browser.');return;}const btn=document.getElementById('voiceBtn');const recognition=new SR();recognition.lang='en-US';btn.style.color='#f85149';setStatus('busy','Listening…');recognition.onresult=e=>{document.getElementById('msgInput').value=e.results[0][0].transcript;btn.style.color='';setStatus('ok','Ready');sendMsg();};recognition.onerror=recognition.onend=()=>{btn.style.color='';setStatus('ok','Ready');};recognition.start();}

async function saveDeal(){
  const data={
    name:document.getElementById('d_name')?.value.trim(),
    company:document.getElementById('d_company')?.value.trim(),
    contact_name:document.getElementById('d_contact')?.value.trim(),
    value:parseFloat(document.getElementById('d_value')?.value)||0,
    close_date:document.getElementById('d_close')?.value,
    stage:document.getElementById('d_stage')?.value,
    probability:parseInt(document.getElementById('d_prob')?.value)||50,
    referrer_id:document.getElementById('d_ref')?.value||null,
    notes:document.getElementById('d_notes')?.value.trim()
  };
  if(!data.name){alert('Deal name is required');return;}
  try{
    await sb.from('sales_deals').insert([data]);
    // Update referrer deal count if referrer selected
    if(data.referrer_id){
      const ref=_salesReferrers.find(r=>r.id===data.referrer_id);
      if(ref){
        const newComm=(parseFloat(ref.commission_earned)||0)+(data.value*(parseFloat(ref.commission_rate)||0)/100);
        await sb.from('sales_referrers').update({
          deals_referred:(ref.deals_referred||0)+1,
          commission_earned:newComm
        }).eq('id',data.referrer_id);
      }
    }
    document.getElementById('dealModal')?.remove();
    showToast('Deal saved');
    await loadSalesData();
  }catch(e){alert('Error: '+e.message);}
}

async function saveNewService(){

async function saveApiQuick(){

async function checkPlatformStatus(){
  const el=document.getElementById('statusContent');

    {name:'Backend API',url:API_URL+'/health',label:'NES AI Backend'},
    {name:'Supabase',url:'https://sfpfjjdtczvuxyhjievt.supabase.co/rest/v1/',label:'Database'},
    {name:'Frontend',url:'https://essential-ai-frontend.vercel.app',label:'Vercel Frontend'},
    {name:'Rocket.Chat',url:'https://chat.essential-services.org/api/v1/info',label:'Team Hub'},
  ];
  const customServices=JSON.parse(localStorage.getItem('nes_custom_services')||'[]');
  const services=[...builtinServices,...customServices];

  const [results, apiCredits, platformStats] = await Promise.all([
    Promise.all(services.map(async function(s){
      const start=Date.now();
      try{const r=await fetch(s.url,{method:'GET',signal:AbortSignal.timeout(5000)});const ms=Date.now()-start;return{...s,ok:r.ok||r.status===401,ms,status:r.ok||r.status===401?'online':'error'};}
      catch(e){return{...s,ok:false,ms:Date.now()-start,status:'offline'};}

    sb.from('api_credits').select('*').order('service_name'),
    Promise.all([
      sb.from('clients').select('*',{count:'exact',head:true}),
      sb.from('leads').select('*',{count:'exact',head:true}),
      sb.from('profiles').select('*',{count:'exact',head:true}),

function renderMyCredsForm(creds, client){
  const el=document.getElementById('myCredsContent');
  // Trial banner
  let trialHtml='';
  if(client.trial_start){
    const trialEnd=new Date(new Date(client.trial_start).getTime()+((client.trial_duration_days||7)*86400000));
    const daysLeft=Math.ceil((trialEnd-new Date())/86400000);
    const expired=daysLeft<=0;
    const urgent=daysLeft<=2&&!expired;
    const color=expired?'#f85149':urgent?'#d29922':'#3fb950';
    const bg=expired?'#2d0e0e':urgent?'#2d1f00':'#0d2818';
    const border=expired?'#f8514940':urgent?'#d2992240':'#3fb95040';
    trialHtml='<div style="padding:12px 16px;border-radius:10px;margin-bottom:16px;background:'+bg+';border:1px solid '+border+';">'+
      '<div style="font-family:var(--mono);font-size:.7rem;font-weight:800;color:'+color+';margin-bottom:4px;">'+(expired?'TRIAL EXPIRED':'TRIAL ACTIVE')+'</div>'+
      '<div style="font-size:.8rem;color:var(--muted);">'+(expired?'Your trial ended on '+trialEnd.toLocaleDateString()+'. Contact support to continue.':daysLeft+' day'+(daysLeft===1?'':'s')+' remaining — trial ends '+trialEnd.toLocaleDateString())+'</div>'+
      (urgent&&!expired?'<div style="font-size:.75rem;color:'+color+';margin-top:4px;font-weight:600;">Connect your credentials now to avoid interruption.</div>':'')+'</div>';
  }
  // Checklist sections
  const sections=[
    {title:'Social media',items:[
      {label:'Facebook',desc:'Page token + Page ID',keys:['facebook_token','facebook_page_id'],icon:'ti-brand-facebook'},
      {label:'Instagram',desc:'Business Account ID',keys:['instagram_business_id'],icon:'ti-brand-instagram'},
      {label:'LinkedIn',desc:'Access token',keys:['linkedin_token'],icon:'ti-brand-linkedin'},
    ]},
    {title:'Messaging & leads',items:[
      {label:'WhatsApp',desc:'Phone ID + API token',keys:['whatsapp_phone_id','whatsapp_token'],icon:'ti-brand-whatsapp'},
      {label:'Lead alerts email',desc:'Where new leads are sent',keys:['lead_email'],icon:'ti-mail'},
      {label:'Website',desc:'Your website URL',keys:['website'],icon:'ti-world'},
    ]},
  ];
  // Progress
  let connected=0,total=0;
  sections.forEach(s=>s.items.forEach(item=>{
    total++;
    if(item.keys.some(k=>creds[k]&&creds[k].trim()))connected++;
  }));
  const pct=total?Math.round((connected/total)*100):0;
  let html=trialHtml;
  html+='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">';
  html+='<div style="font-size:.8rem;color:var(--muted);">'+connected+' / '+total+' connected</div>';
  html+='<div style="font-size:.8rem;color:var(--nes-blue);font-family:var(--mono);font-weight:700;">'+pct+'%</div></div>';
  html+='<div style="background:var(--surface);border-radius:6px;height:6px;margin-bottom:20px;overflow:hidden;">';
  html+='<div style="height:100%;width:'+pct+'%;background:'+(pct===100?'#3fb950':'#409cff')+';border-radius:6px;transition:width .4s;"></div></div>';
  sections.forEach(function(sec){
    html+='<div style="font-family:var(--mono);font-size:.65rem;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-bottom:8px;margin-top:16px;">'+sec.title+'</div>';
    sec.items.forEach(function(item){
      const isConnected=item.keys.some(k=>creds[k]&&creds[k].trim());
      html+='<div style="display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--border);border-radius:10px;margin-bottom:6px;">';
      html+='<div style="width:34px;height:34px;border-radius:8px;background:var(--bg);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;"><i class="ti '+item.icon+'" style="font-size:16px;color:var(--nes-blue);"></i></div>';

      html+='<div style="font-size:.72rem;color:var(--muted);">'+item.desc+'</div></div>';
      html+='<div style="display:flex;align-items:center;gap:8px;">';
      html+='<span style="font-size:.68rem;font-family:var(--mono);padding:3px 10px;border-radius:12px;background:'+(isConnected?'#0d2818':'#2d1f00')+';color:'+(isConnected?'#3fb950':'#d29922')+';">'+(isConnected?'Connected':'Missing')+'</span>';

function editItCred(keysStr, label){
  const keys=keysStr.split(',');
  const creds=window._itCredsCache||{};
  document.getElementById('it-cred-title').textContent=label;
  const fieldLabels={
    facebook_token:'Page token',facebook_page_id:'Page ID',
    instagram_business_id:'Business Account ID',
    whatsapp_phone_id:'Phone ID',whatsapp_token:'API token',
    linkedin_token:'Access token',
    lead_email:'Email address',website:'Website URL'
  };
  let html='';
  keys.forEach(function(k){
    const val=(creds[k]||'').replace(/"/g,'&quot;');
    const isPwd=k.includes('token');
    html+='<div style="margin-bottom:8px;"><div style="font-family:var(--mono);font-size:.65rem;color:var(--muted);margin-bottom:4px;">'+(fieldLabels[k]||k)+'</div>';

  });

  document.getElementById('it-cred-form').style.display='block';
  window._itActiveKeys=keys;
  document.querySelector('#it-cred-fields input')?.focus();
}

async function saveItCred(){
  const keys=window._itActiveKeys||[];
  const creds=window._itCredsCache||{};
  keys.forEach(function(k){
    const el=document.getElementById('itf_'+k);
    if(el&&el.value.trim())creds[k]=el.value.trim();
  });
  window._itCredsCache=creds;
  try{
    const res=await fetch(API_URL+'/api/client/'+userClientId+'/credentials',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({credentials:creds})
    });
    if(!res.ok)throw new Error(await res.text());
    showToast('Saved ✓');
    document.getElementById('it-cred-form').style.display='none';
    renderMyCredsForm(creds, window._itClientCache||{});
  }catch(e){alert('Error: '+e.message);}
}

function loadLocal(){
  try{
    const h=localStorage.getItem(STORAGE_KEYS.h);if(h)history=JSON.parse(h);
    allMsgsHTML=localStorage.getItem(STORAGE_KEYS.m)||''
    const u=localStorage.getItem(STORAGE_KEYS.u);
    if(u){const ud=JSON.parse(u);if(ud.date===new Date().toDateString()){chatUsed=ud.c||0;imagesUsed=ud.i||0;docsUsed=ud.d||0;}}
  }catch(e){}
}

  try{
    localStorage.setItem(STORAGE_KEYS.h,JSON.stringify(history.slice(-30)));

    if(msgs){allMsgsHTML=msgs.innerHTML;localStorage.setItem(STORAGE_KEYS.m,allMsgsHTML);}

}

async function loadUsageFromServer(){
  if(!session)return;
  try{const res=await fetch(API_URL+'/api/usage',{headers:{'Authorization':'Bearer '+session.access_token}});if(res.ok){const d=await res.json();chatUsed=d.chats||chatUsed;imagesUsed=d.images||imagesUsed;docsUsed=d.docs||docsUsed;updateStats();}}catch(e){}
}
function updateStats(){
  const limits=getCurrentLimits();
  const sm=document.getElementById('statMsgs');const si=document.getElementById('statImages');const sd=document.getElementById('statDocs');
  if(sm)sm.textContent=Math.max(0,limits.messages-chatUsed);
  if(si)si.textContent=Math.max(0,limits.images-imagesUsed);
  if(sd)sd.textContent=Math.max(0,limits.docs-docsUsed);
  document.getElementById('usageTxt').textContent=chatUsed+' / '+limits.messages;
  const fill=document.getElementById('usageFill');
  if(fill)fill.style.width=Math.min(100,(chatUsed/limits.messages)*100)+'%';
}
function toggleSidebar(){
  const sb=document.getElementById('sidebar');

  else sb.classList.toggle('collapsed');

function clearChat(){
  if(!confirm('Clear all messages?'))return;
  history=[];allMsgsHTML='';
  localStorage.removeItem(STORAGE_KEYS.h);localStorage.removeItem(STORAGE_KEYS.m);
  const msgs=document.getElementById('messages');if(msgs)msgs.innerHTML='';
  addAiMsg('Cleared. How can I help you?');
}
function toggleTheme(){
  const html=document.documentElement;
  const isDark=html.getAttribute('data-theme')==='dark';
  html.setAttribute('data-theme',isDark?'light':'dark');
  const btn=document.querySelector('.top-btn[onclick="toggleTheme()"]');
  if(btn)btn.innerHTML=isDark?'<i class="ti ti-moon"></i>':' <i class="ti ti-sun"></i>';
}
function cleanDisplay(text){
  if(!text)return text;
  const bad=['weather.com','accuweather','timeanddate','meteorology department','historical records','need to check','such as weather','check a weather','check a service','maintains historical','maintains records'];
  return text.split('\n').filter(function(line){
    const l=line.toLowerCase();
    return !bad.some(function(b){return l.includes(b);});
  }).join('\n').trim();
}
function userBubble(text){return`<div class="msg user"><div class="user-av-msg">${session?.user?.email?.[0]?.toUpperCase()||'U'}</div><div class="msg-body"><div class="msg-role">You</div><div class="msg-bubble">${esc(text)}</div></div></div>`;}
function aiBubble(text,sources=[]){
  const src=sources.length?'<div class="sources-block">Sources: '+sources.map(s=>'<a href="'+esc(s.url)+'" target="_blank">'+esc(s.title||s.url)+'</a>').join(' · ')+'</div>':''
  return`<div class="msg ai"><div class="chat-av-wrap"><div class="chat-av-ring"><div class="chat-av-mid"><div class="chat-av-dot"></div></div></div><div class="chat-av-online"></div></div><div class="msg-body"><div class="msg-role">NES AI</div><div class="msg-bubble">${md(text)}${src}</div><button class="copy-btn" onclick="copyMsg(this)">Copy</button></div></div>`;
}
function imgBubble(url){return`<div class="msg ai"><div class="chat-av-wrap"><div class="chat-av-ring"><div class="chat-av-mid"><div class="chat-av-dot"></div></div></div><div class="chat-av-online"></div></div><div class="msg-body"><div class="msg-role">NES AI · Image Gen</div><div class="msg-bubble"><img src="${esc(url)}" style="max-width:100%;border-radius:10px;margin-top:4px;"></div></div></div>`;}
function addAiMsg(text,sources=[]){appendMsg(aiBubble(text,sources));saveHistory();}
function addTyping(){
  const el=document.createElement('div');el.className='msg ai';el.id='typing';
  el.innerHTML=`<div class="chat-av-wrap"><div class="chat-av-ring"><div class="chat-av-mid"><div class="chat-av-dot"></div></div></div><div class="chat-av-online"></div></div><div class="msg-body"><div class="msg-role">NES AI</div><div class="msg-bubble"><div style="display:flex;gap:5px;">${[0,.2,.4].map(d=>`<div style="width:7px;height:7px;background:var(--nes-blue);border-radius:50%;animation:bounce 1.4s ${d}s infinite;"></div>`).join('')}</div></div></div>`;
  document.getElementById('messages')?.appendChild(el);scroll();
}
function removeTyping(){document.getElementById('typing')?.remove();}
function appendMsg(html){document.getElementById('messages')?.insertAdjacentHTML('beforeend',html);scroll();saveHistory();}
function scroll(){const c=document.getElementById('messages');if(c)c.scrollTop=c.scrollHeight;}
function copyMsg(btn){const bubble=btn.closest('.msg-body').querySelector('.msg-bubble');navigator.clipboard.writeText(bubble.innerText||'').then(()=>{btn.textContent='Copied';setTimeout(()=>btn.textContent='Copy',2000);}).catch(()=>{});}
function setBusy(b){
  busy=b;
  const sb=document.getElementById('sendBtn');if(sb)sb.disabled=b;
  setStatus(b?'busy':'ok',b?'Thinking…':'Ready');
  // Update ping dot color — blue=ready, amber=busy
  const dot=document.getElementById('promptPingDot');
  const ring=document.getElementById('promptPingRing');
  const avatar=document.getElementById('promptPingAvatar');
  if(dot)dot.style.background=b?'#d29922':'#409cff';
  if(ring)ring.style.borderColor=b?'#d29922':'#409cff';
  if(avatar)avatar.style.borderColor=b?'#d29922':'#1a56db';
}
function setStatus(cls,txt){const el=document.getElementById('statusEl');if(el){el.className='status-dot'+(cls==='busy'?' busy':'');el.textContent=txt;}}
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":' &#39;'}) [m]);}
function md(s){let m=esc(s);m=m.replace(/```(\w*)\n?([\s\S]*?)```/g,'<pre style="background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:10px 14px;overflow-x:auto;font-family:var(--mono);font-size:.8rem;margin:8px 0"><code>$2</code></pre>');m=m.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');m=m.replace(/`([^`\n]+)`/g,'<code style="background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:1px 5px;font-family:var(--mono);font-size:.85em">$1</code>');m=m.replace(/\n\n/g,'</p><p>').replace(/\n/g,'<br>');return'<p>'+m+'</p>'.replace(/<p>\s*<\/p>/g,'');}

  const grid=document.querySelector('#cm-creds .creds-grid');

  const label=prompt('Field name (e.g. stripe_key):');

  const key=label.trim().toLowerCase().replace(/\s+/g,'_').replace(/[^a-z0-9_]/g,'');
